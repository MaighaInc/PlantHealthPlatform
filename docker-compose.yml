services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phs
      POSTGRES_PASSWORD: phs
      POSTGRES_DB: phs
    ports:
      - "5432:5432"
    volumes:
      - phs_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://phs:phs@db:5432/phs
      DEVELOPMENT_MODE: SIMULATION
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  phs_pg:
