services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phs
      POSTGRES_PASSWORD: phs
      POSTGRES_DB: phs
    ports:
      - "5432:5432"
    volumes:
      - phs_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://phs:phs@db:5432/phs
      DEVELOPMENT_MODE: SIMULATION
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # ROS 2 Humble SIMULATION stack (optional — use profile `ros` or `full`).
  # Linux: add network_mode: host if bridging DDS to host nodes is required.
  ros:
    profiles: ["ros", "full"]
    build:
      context: .
      dockerfile: ros2_ws/Dockerfile
    environment:
      ROS_LOCALHOST_ONLY: "1"
      DEVELOPMENT_MODE: SIMULATION
    # Uncomment on Linux to discover host/WSL ROS peers on the same machine:
    # network_mode: host

volumes:
  phs_pg:
